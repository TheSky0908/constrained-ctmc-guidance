# RealToxicityPrompts — used as the *prompt* source for conditional (prefix-
# conditioned) toxicity-controlled generation. The dataset is loaded directly by
# the eval harness (tox_eval.py) to select toxic prefixes; this config mainly
# supplies the GPT-2 tokenizer (matching kuleshov-group/mdlm-owt) and the
# classification plumbing used by D-CBG / adaptive-dual guidance.
train: realtoxicityprompts
valid: realtoxicityprompts
tokenizer_name_or_path: gpt2
cache_dir: /local/scratch/zhiheng/guidance/.data_cache
wrap: False
streaming: False
override_cache: False
add_special_tokens: True
label_col: toxic
num_classes: 2
