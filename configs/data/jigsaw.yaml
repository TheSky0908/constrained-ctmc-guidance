# Jigsaw Toxic Comment Classification — training data for the noisy toxicity
# guidance classifier (D-CBG / adaptive-dual) and the external GPT-Neo violation
# scorer. Multiple Jigsaw toxicity sub-labels are consolidated into a single
# binary `toxic` target (see dataloader.get_dataset). GPT-2 tokenizer matches the
# mdlm-owt latent space.
train: jigsaw
valid: jigsaw
tokenizer_name_or_path: gpt2
cache_dir: /local/scratch/zhiheng/guidance/.data_cache
wrap: False
streaming: False
override_cache: False
add_special_tokens: True
label_col: toxic
num_classes: 2
