# Held-out Jigsaw text labelled with the GPT-Neo surrogate's continuous
# toxicity score (built by label_jigsaw_with_surrogate.py). Used to train the
# per-tau guidance classifiers via `+data.label_col_value_threshold=<tau>`
# (class 1 = toxicity_score <= tau). GPT-2 tokenizer matches mdlm-owt.
train: jigsaw_scored
valid: jigsaw_scored
tokenizer_name_or_path: gpt2
cache_dir: /local/scratch/zhiheng/guidance/.data_cache
wrap: False
streaming: False
override_cache: False
add_special_tokens: True
label_col: toxicity_score
label_col_pctile: null  # per-tau cuts use +data.label_col_value_threshold, not percentile
num_classes: 2
